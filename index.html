<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon planning · L1 maths-physique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8f9;--surface:#fff;--ink:#4a3f45;--muted:#9a8c94;--line:#f4e7ec;
--cal:#e3effc;--calb:#8db8ea;--alg:#ece6fa;--algb:#b4a2e6;--phy:#e4f2e6;--phyb:#92c79b;--ato:#fdeadc;--atob:#f2b88b;--org:#fff3c9;--orgb:#e6c75c;
--exam:#ffdfe0;--examb:#e0343f;--examt:#b3202c;--off:#f6f1f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e191d;--surface:#292328;--ink:#f3e9ee;--muted:#a899a1;--line:#3a3138;
--cal:#2a3748;--alg:#34304a;--phy:#2a3d2f;--ato:#4a3629;--org:#47401f;--exam:#52262b;--examt:#ff8d94;--off:#2a2428}}
:root[data-theme="dark"]{--bg:#1e191d;--surface:#292328;--ink:#f3e9ee;--muted:#a899a1;--line:#3a3138;--cal:#2a3748;--alg:#34304a;--phy:#2a3d2f;--ato:#4a3629;--org:#47401f;--exam:#52262b;--examt:#ff8d94;--off:#2a2428}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.45}
main{max-width:620px;margin:0 auto;padding:28px 16px 48px}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:46px;line-height:1;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:26px}
.chip{font-size:12.5px;padding:4px 11px;border-radius:99px;font-weight:500}
.ex{background:var(--exam);border-radius:22px;padding:18px 18px 8px;margin-bottom:34px}
.ex h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:26px;margin:0 0 10px;color:var(--examt)}
.ex li{list-style:none;display:flex;gap:12px;padding:9px 0;border-top:1px solid rgba(224,52,63,.18);font-size:14.5px}
.ex ul{margin:0;padding:0}
.ex .d{min-width:84px;font-weight:600;color:var(--examt)}
.ex small{display:block;color:var(--muted);font-size:12.5px}
.wk{margin-bottom:30px}
.wk h3{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-style:italic;font-size:22px;color:var(--muted);margin:0 0 10px}
.day{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:10px}
.day.today{border:2px solid #f2a7bd}
.dt{width:46px;flex:none;text-align:center;padding-top:4px}
.dt b{display:block;font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:30px;line-height:1}
.dt span{font-size:12.5px;color:var(--muted)}
.today .dt span{color:#d6557b;font-weight:600}
.its{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.it{border-left:4px solid;border-radius:10px 14px 14px 10px;padding:7px 11px;font-size:14.5px}
.it .t{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.it .n{font-weight:600}
.it .r{font-size:12.5px;color:var(--muted)}
.cal{background:var(--cal);border-color:var(--calb)}.alg{background:var(--alg);border-color:var(--algb)}
.phy{background:var(--phy);border-color:var(--phyb)}.ato{background:var(--ato);border-color:var(--atob)}
.org{background:var(--org);border-color:var(--orgb)}
.exam{background:var(--exam);border-color:var(--examb)}.exam .n,.exam .t{color:var(--examt)}
.off{background:var(--off);border-color:#d9ccd2;color:var(--muted)}.off .n{text-decoration:line-through;font-weight:500}
.free{color:var(--muted);font-size:14px;padding:8px 2px;font-style:italic}
.vac{text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:20px;color:var(--muted);margin-bottom:30px;font-family:"Instrument Serif",Georgia,serif;font-size:21px}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>Mon planning</h1>
<p class="sub" id="sub"></p>
<div class="legend" id="legend"></div>
<section class="ex" id="ex"></section>
<div id="wks"></div>
<p class="foot">Les cours annulés sont barrés. Salles indiquées quand elles figurent sur l’emploi du temps.</p>
</main>
<script>
const K={cal:"Calculus",alg:"Algèbre et géométrie",phy:"Physique générale",ato:"Atomistique",org:"Chimie organique",exam:"Examens"};
const I=(a,b,t,k,r)=>({a,b,t,k,r});
const W=[
["2026-11-23",[[],
[I("8:15","10:15","Amphi Chimie organique","org","333-H1"),I("10:30","12:00","Amphi Algèbre et géométrie","alg"),I("13:30","15:30","Physique générale I","off")],
[I("8:15","10:15","TD Calculus","cal","336-138"),I("13:30","15:30","Physique générale I (report)","phy","336-138")],
[I("10:30","12:30","TD Calculus","cal"),I("13:30","15:30","Physique générale I","off"),I("15:45","17:45","TD 10 Atomistique","off")],
[I("8:45","10:15","TD Calculus","off"),I("10:30","12:30","TD Algèbre et géométrie","alg"),I("13:30","15:30","Physique générale I (report)","phy","336-129")]]],
["2026-11-30",[
[I("10:30","12:30","Amphi Calculus","cal"),I("13:30","15:30","Physique générale I","phy"),I("15:45","17:45","TD Chimie organique","org","336-107")],
[I("8:15","10:15","Amphi Chimie organique","org","333-H1"),I("10:30","12:00","Amphi Algèbre et géométrie","alg"),I("13:30","15:30","Physique générale I","off"),I("15:45","17:45","PPEI","off")],
[I("13:30","15:30","Physique générale I (report)","phy","460-8221"),I("15:45","17:45","TD 11 Atomistique","ato","336-138")],
[I("10:30","12:30","TD Calculus","cal"),I("13:30","15:30","Physique générale I","off"),I("15:45","17:45","TD 11 Atomistique","off")],
[I("8:45","10:15","TD Calculus","cal"),I("10:30","12:30","TD Algèbre et géométrie","alg"),I("13:30","15:30","Physique générale I (report)","phy","336-133"),I("15:45","17:45","CC Atomistique","exam","337-2")]]],
["2026-12-07",[
[I("8:15","10:15","TD 11 Atomistique","ato","336-138"),I("10:30","12:30","Amphi Calculus","cal"),I("13:30","15:30","Physique générale I","phy"),I("15:45","17:45","TD Chimie organique","org","336-107")],
[I("8:15","10:15","Amphi Chimie organique","org","333-H1"),I("13:30","15:30","Physique générale I","off"),I("15:45","17:45","PPEI","off")],
[I("8:45","9:45","CC Chimie organique","exam"),I("13:30","15:30","Physique générale I (report)","phy","336-105")],
[I("10:30","12:30","TD Calculus","cal"),I("13:30","15:30","Physique générale I","off"),I("15:45","17:45","TD 11 Atomistique","off")],
[I("8:45","10:15","TD Calculus","cal"),I("10:30","12:30","TD Algèbre et géométrie","alg"),I("13:30","15:30","Physique générale I (report)","phy","336-133")]]],
["2026-12-14",[
[I("8:15","12:30","CC à distance · Atomes et molécules organiques (sur ecampus)","exam"),I("15:45","17:45","TD soutien Chimie organique","org","336-107")],
[I("8:30","10:30","EEF Atomistique","exam","337-2"),I("13:45","16:45","EEF Physique générale I","exam","337-2 et 337-3")],
[I("10:30","12:30","EEF Maths 2 · Algèbre et géométrie","exam","336 sous-sol et 337-2"),I("13:45","15:45","EEF Maths 1 · Calculus","exam","336-129 et 337-2")],
[],[]]],
["2026-12-21","Vacances de Noël · du 21 décembre au 3 janvier","2027-01-03"],
["2027-01-04",[[],
[],[],
[I("9:30","11:00","EEF Atomes et molécules organiques","exam","337-2"),I("13:45","15:45","EEF Python","exam","337-2")],
[]]]
];
const pad=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hh=s=>s.replace(":","h");
const fmt=(d,o)=>new Intl.DateTimeFormat("fr-FR",o).format(d);
const todayD=new Date(),today=iso(todayD);
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const time=i=>i.a?hh(i.a)+"–"+hh(i.b):i.b;
document.getElementById("sub").textContent="Du "+fmt(todayD,{day:"numeric",month:"long"})+" au 8 janvier";
document.getElementById("legend").innerHTML=Object.keys(K).map(k=>`<span class="chip ${k}" style="border:0">${K[k]}</span>`).join("")+`<span class="chip off" style="text-decoration:line-through">Annulé</span>`;
const exams=[];let html="";
W.forEach(w=>{
 const mon=parse(w[0]);
 if(typeof w[1]==="string"){ if(w[2]>=today) html+=`<div class="vac">${w[1]}</div>`; return;}
 let days="";
 w[1].forEach((items,i)=>{
  const d=new Date(mon);d.setDate(mon.getDate()+i);const s=iso(d);
  if(s<today) return;
  const its=items;
  its.forEach(x=>{if(x.k==="exam")exams.push({d,x})});
  days+=`<div class="day${s===today?" today":""}"><div class="dt"><b>${d.getDate()}</b><span>${s===today?"aujourd’hui":fmt(d,{weekday:"short"})}</span></div><div class="its">`+
  (its.length?its.map(x=>`<div class="it ${x.k}"><div class="t">${time(x)}</div><div class="n">${x.t}${x.k==="off"?"":""}</div>${x.r?`<div class="r">${x.r}</div>`:""}${x.k==="off"?`<div class="r">annulé</div>`:""}</div>`).join(""):`<div class="free">Journée libre</div>`)+`</div></div>`;
 });
 if(days){const end=new Date(mon);end.setDate(mon.getDate()+4);
  html+=`<div class="wk"><h3>Semaine du ${fmt(mon,{day:"numeric",month:"long"})}</h3>${days}</div>`;}
});
document.getElementById("wks").innerHTML=html;
const ex=document.getElementById("ex");
ex.innerHTML=exams.length?`<h2>Examens à venir</h2><ul>`+exams.map(e=>`<li><span class="d">${fmt(e.d,{weekday:"short",day:"numeric",month:"short"})}</span><span>${e.x.t}<small>${time(e.x)}${e.x.r?" · "+e.x.r:""}</small></span></li>`).join("")+`</ul>`:"";
if(!exams.length)ex.style.display="none";
</script>
</body>
</html>
